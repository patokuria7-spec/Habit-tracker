<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Tracker</title>
<style>
:root{
  --bg:#F3F6FB; --card:#FFFFFF; --ink:#10233F; --muted:#6B7A90; --line:#E1E8F2;
  --accent:#059669; --accent-ink:#FFFFFF; --danger:#D6334A; --flame:#E8590C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E1A2E; --card:#16263F; --ink:#EEF3FB; --muted:#9BB0CF; --line:#27395A; --accent:#34D399; --accent-ink:#0E1A2E; --danger:#FF7C8F; --flame:#FFA24C; }
}
:root[data-theme="dark"]{ --bg:#0E1A2E; --card:#16263F; --ink:#EEF3FB; --muted:#9BB0CF; --line:#27395A; --accent:#34D399; --accent-ink:#0E1A2E; --danger:#FF7C8F; --flame:#FFA24C; }
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;padding:24px 16px 48px}
main{max-width:520px;margin:0 auto}
h1{font-size:2rem;letter-spacing:-0.03em;margin:8px 0 4px}
#sub{color:var(--muted);margin:0 0 20px}
.add{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;min-width:0;font:inherit;font-size:1rem;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;min-height:52px}
input:focus{outline:none;border-color:var(--accent)}
button{font:inherit;cursor:pointer;border:0}
.addbtn{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:0 20px;min-height:52px}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;min-height:44px;border-radius:999px;background:var(--card);color:var(--muted);border:2px solid var(--line);font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav b{font-size:1.1rem}
.nav button{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;width:48px;min-height:44px;font-size:1.2rem}
.nav button:disabled{opacity:.35;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.name{font-weight:700;font-size:1.1rem;word-break:break-word}
.streak{color:var(--muted);font-size:.9rem;margin-top:2px}
.streak.hot{color:var(--flame);font-weight:600}
.del{background:none;color:var(--muted);font-size:1.4rem;width:44px;min-height:44px;flex:none}
.goal{margin-bottom:14px}
.goalrow{display:flex;align-items:center;justify-content:space-between;font-size:.9rem;margin-bottom:6px}
.step{display:flex;align-items:center;gap:6px;color:var(--muted)}
.step button{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;width:36px;min-height:36px;font-size:1.1rem}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar div{height:100%;background:var(--accent);border-radius:999px;transition:width .2s ease}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;color:var(--muted);font-size:.75rem;padding:0}
.dot{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:1rem;color:var(--accent-ink)}
.day.on .dot{background:var(--accent);border-color:var(--accent)}
.day.today{color:var(--ink);font-weight:700}
.day.today .dot{border-color:var(--accent)}
.dh{color:var(--muted);font-size:.75rem;text-align:center;padding-bottom:2px}
.cell{width:100%;aspect-ratio:1;max-width:44px;margin:0 auto;border-radius:50%;border:2px solid var(--line);background:none;color:var(--ink);font-size:.8rem;display:grid;place-items:center;padding:0}
.cell.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.cell.today{border-color:var(--accent)}
.cell:disabled{opacity:.3;cursor:default}
.mstat{color:var(--muted);font-size:.85rem;margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:28px 0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Habit Tracker</h1>
  <p id="sub"></p>
  <div class="add">
    <input id="input" type="text" placeholder="New habit, e.g. Walk 20 min" maxlength="50" autocomplete="off" aria-label="New habit">
    <button class="addbtn" id="add" type="button">Add</button>
  </div>
  <div class="seg">
    <button type="button" data-v="week">Week</button>
    <button type="button" data-v="month">Month</button>
  </div>
  <div class="nav" id="nav" hidden>
    <button type="button" id="prev" aria-label="Previous month">‹</button>
    <b id="mlabel"></b>
    <button type="button" id="next" aria-label="Next month">›</button>
  </div>
  <div id="list"></div>
</main>
<script>
var habits=[], view="week", mo=0, list=document.getElementById("list"), input=document.getElementById("input"), sub=document.getElementById("sub");
try{var s=localStorage.getItem("habits"); habits=s?JSON.parse(s):[{id:1,name:"Drink water",days:{}},{id:2,name:"Read 10 pages",days:{}}];}catch(e){habits=[{id:1,name:"Drink water",days:{}}];}
habits.forEach(function(h){if(!h.goal)h.goal=5;});
function save(){try{localStorage.setItem("habits",JSON.stringify(habits));}catch(e){}}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function lastDays(n){var a=[];for(var i=n-1;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);a.push(d);}return a;}
function streak(h){var d=new Date();if(!h.days[key(d)])d.setDate(d.getDate()-1);var c=0;while(h.days[key(d)]){c++;d.setDate(d.getDate()-1);}return c;}
function weekCount(h){var d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));var c=0;for(var i=0;i<7;i++){var x=new Date(d);x.setDate(d.getDate()+i);if(h.days[key(x)])c++;}return c;}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;}
function toggle(h,k){if(h.days[k])delete h.days[k];else h.days[k]=true;save();render();}

function goalBlock(h){
  var c=weekCount(h),g=h.goal,box=el("div","goal"),row=el("div","goalrow");
  row.appendChild(el("span","","This week: "+c+" / "+g+" days"+(c>=g?" 🎉":"")));
  var st=el("div","step"),m=el("button","","−"),p=el("button","","+");
  m.type=p.type="button";m.setAttribute("aria-label","Lower weekly goal");p.setAttribute("aria-label","Raise weekly goal");
  m.onclick=function(){if(h.goal>1){h.goal--;save();render();}};
  p.onclick=function(){if(h.goal<7){h.goal++;save();render();}};
  st.appendChild(el("span","","Goal"));st.appendChild(m);st.appendChild(p);row.appendChild(st);
  var bar=el("div","bar"),f=el("div");f.style.width=Math.min(100,Math.round(c/g*100))+"%";bar.appendChild(f);
  box.appendChild(row);box.appendChild(bar);return box;
}
function weekGrid(h,todayKey){
  var week=el("div","week");
  lastDays(7).forEach(function(d){
    var k=key(d),b=el("button","day"+(h.days[k]?" on":"")+(k===todayKey?" today":""));b.type="button";
    b.setAttribute("aria-label",d.toDateString()+(h.days[k]?", done":", not done"));
    b.appendChild(el("span","dot",h.days[k]?"✓":""));
    b.appendChild(el("span","",k===todayKey?"Today":d.toLocaleDateString(undefined,{weekday:"short"}).slice(0,3)));
    b.onclick=function(){toggle(h,k);};week.appendChild(b);
  });
  return week;
}
function monthGrid(h,todayKey){
  var now=new Date(),first=new Date(now.getFullYear(),now.getMonth()+mo,1),y=first.getFullYear(),m=first.getMonth();
  var n=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7,wrap=el("div"),g=el("div","week"),cnt=0;
  ["M","T","W","T","F","S","S"].forEach(function(l){g.appendChild(el("div","dh",l));});
  for(var i=0;i<lead;i++)g.appendChild(el("div"));
  for(var d=1;d<=n;d++){
    var dt=new Date(y,m,d),k=key(dt),b=el("button","cell"+(h.days[k]?" on":"")+(k===todayKey?" today":""),String(d));b.type="button";
    if(h.days[k])cnt++;
    if(dt>now&&k!==todayKey)b.disabled=true;
    (function(k){b.onclick=function(){toggle(h,k);};})(k);
    g.appendChild(b);
  }
  wrap.appendChild(g);wrap.appendChild(el("div","mstat",cnt+(cnt===1?" day":" days")+" done this month"));
  return wrap;
}
function render(){
  list.innerHTML="";
  var todayKey=key(new Date()),done=habits.filter(function(h){return h.days[todayKey];}).length;
  sub.textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})+(habits.length?" · "+done+" of "+habits.length+" done today":"");
  document.querySelectorAll(".seg button").forEach(function(b){b.classList.toggle("on",b.dataset.v===view);});
  document.getElementById("nav").hidden=view!=="month";
  var now=new Date();document.getElementById("mlabel").textContent=new Date(now.getFullYear(),now.getMonth()+mo,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});
  document.getElementById("next").disabled=mo>=0;
  if(!habits.length){list.appendChild(el("div","empty","Add your first habit above."));return;}
  habits.forEach(function(h){
    var card=el("div","card"),head=el("div","head"),left=el("div");
    left.appendChild(el("div","name",h.name));
    var st=streak(h);left.appendChild(el("div","streak"+(st>0?" hot":""),st>0?"🔥 "+st+" day streak":"No streak yet. Start today!"));
    var del=el("button","del","×");del.type="button";del.setAttribute("aria-label","Delete habit");
    del.onclick=function(){habits=habits.filter(function(x){return x.id!==h.id;});save();render();};
    head.appendChild(left);head.appendChild(del);
    card.appendChild(head);card.appendChild(goalBlock(h));
    card.appendChild(view==="week"?weekGrid(h,todayKey):monthGrid(h,todayKey));
    list.appendChild(card);
  });
}
function add(){var v=input.value.trim();if(!v)return;habits.push({id:Date.now(),name:v,goal:5,days:{}});input.value="";save();render();input.focus();}
document.getElementById("add").onclick=add;
input.addEventListener("keydown",function(e){if(e.key==="Enter")add();});
document.querySelectorAll(".seg button").forEach(function(b){b.onclick=function(){view=b.dataset.v;render();};});
document.getElementById("prev").onclick=function(){mo--;render();};
document.getElementById("next").onclick=function(){if(mo<0){mo++;render();}};
render();
</script>
</body>
</html>
